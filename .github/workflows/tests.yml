# IPSELIA M1 protected CI (C5 / C6). The job name "tests" is the check-run name IPSELIA reads
# (REGORA_ENGINEERING_CI_CHECK_NAME). The coding agent may never change this file (C3: .github/** is protected).
name: tests

on:
  push:
    branches: ["main", "ipselia/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==8.3.5
      - name: Run the tests
        run: python -m pytest -q --junitxml=results.xml
      - name: Announce the test count for IPSELIA (C6)
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          bad = sum(int(suite.get(k, 0)) for k in ("failures", "errors", "skipped"))
          print(f"::notice title=regora-tests::total={total} passed={total - bad}")
          PY
